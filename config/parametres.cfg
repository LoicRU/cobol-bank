# Parametres de cobol-bank
# Format : CLE=valeur (une par ligne). Lignes vides et lignes commencant par #
# ignorees. Une cle absente garde sa valeur par defaut (indiquee ci-dessous).
# Le point ou la virgule sert de separateur decimal.
# Fichier different : variable d'environnement PARAMS_FILE.

# Plafond journalier de sorties (retraits + virements emis) quand un compte
# n'a pas de plafond propre. Defaut 1000.00 (0.01 a 9999999.99)
PLAFOND_DEFAUT=1000.00

# Alerte MONTANT_ANORMAL si le montant depasse FACTEUR x la moyenne des
# operations acceptees du compte. Defaut 5 (1 a 99)
FACTEUR_ANOMALIE=5

# Nombre minimal d'operations acceptees avant d'appliquer cette regle.
# Defaut 3 (1 a 99)
MIN_HISTORIQUE=3

# Taux annuel des interets, en pourcentage. Defaut 1.50 (0 a 100)
TAUX_ANNUEL_PCT=1.50

# Frais mensuels de tenue de compte. Defaut 2.00 (0 a 99999.99)
FRAIS_TENUE=2.00

# Echecs de PIN consecutifs avant blocage du client. Defaut 3 (1 a 99)
MAX_ECHECS_PIN=3

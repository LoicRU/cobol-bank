# Parametres de cobol-bank
# Format : CLE=valeur (une par ligne). Lignes vides et lignes commencant par #
# ignorees. Une cle absente garde sa valeur par defaut (indiquee ci-dessous).
# Le point ou la virgule sert de separateur decimal.
# Fichier different : variable d'environnement PARAMS_FILE.

# Plafond journalier de sorties (retraits + virements emis) quand un compte
# n'a pas de plafond propre. Defaut 1000.00 (0.01 a 9999999.99)
PLAFOND_DEFAUT=1000.00

# Alerte MONTANT_ANORMAL si le montant depasse FACTEUR x la moyenne des
# operations acceptees du compte. Defaut 5 (1 a 99)
FACTEUR_ANOMALIE=5

# Nombre minimal d'operations acceptees avant d'appliquer cette regle.
# Defaut 3 (1 a 99)
MIN_HISTORIQUE=3

# Taux annuel des interets, en pourcentage. Defaut 1.50 (0 a 100)
TAUX_ANNUEL_PCT=1.50

# Frais mensuels de tenue de compte. Defaut 2.00 (0 a 99999.99)
FRAIS_TENUE=2.00

# Echecs de PIN consecutifs avant blocage du client. Defaut 3 (1 a 99)
MAX_ECHECS_PIN=3

# Alerte ECHECS_RAPIDES quand ce nombre d'echecs de PIN consecutifs est
# atteint en moins de FENETRE_ECHECS_SEC secondes depuis le premier echec de
# la serie (sans forcement bloquer le client). Defaut 2 (2 a 99)
ALERTE_ECHECS=2

# Duree de la fenetre, en secondes. Defaut 300 (1 a 86400)
FENETRE_ECHECS_SEC=300

# Taux annuel des interets des comptes epargne, en pourcentage.
# Defaut 3.00 (0 a 100). Les comptes epargne ne paient pas de frais de tenue.
TAUX_EPARGNE_PCT=3.00

# Taux annuel des agios, en pourcentage, preleves chaque mois sur les comptes
# courants a solde negatif : |solde| x taux / 12. Prelevement meme au-dela du
# decouvert autorise. Pas d'agios sur l'epargne. Defaut 12.00 (0 a 100)
TAUX_AGIOS_PCT=12.00

# Nombre maximal de comptes qu'un client peut s'ouvrir lui-meme (l'administrateur
# n'est pas limite). Defaut 5 (1 a 99)
MAX_COMPTES_CLIENT=5

# Inscriptions libres (clients qui se creent eux-memes) acceptees par heure.
# Au-dela, refus et alerte INSCRIPTIONS. Defaut 20 (1 a 9999)
MAX_INSCRIPTIONS_HEURE=20
